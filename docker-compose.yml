version: '3.8'

services:
  app:
    build: .
    ports:
      - "3007:3007"   # Vite dev server (frontend)
      - "3008:3008"   # Express API (backend)
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/warehouse}
      - JWT_SECRET=${JWT_SECRET:-warehouse-app-secret-key}
      - PORT=3008
    depends_on:
      - db
    volumes:
      - .:/app
    command: ["sh", "-c", "npm run dev"]

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pg_data: